name: Go

on:
  push:
    # Stagehand fork: also run on the stagehand branch (FK-01).
    branches: [ master, stagehand ]
  pull_request:
    branches: [ master, stagehand ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.25"

    - name: Build
      uses: goreleaser/goreleaser-action@v7
      with:
        version: latest
        args: build --snapshot --clean

    - name: Test
      run: go test -v ./...
