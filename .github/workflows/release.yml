name: release

# Stagehand fork release (docs/stagehand/MAINTAINING.md, "Cut a release").
#
# Runs only for fork tags, vX.Y.Z-stagehand.N, so upstream's own v* tags (which a
# GitHub fork carries) never publish anything here. It tests, then goreleaser
# builds the linux amd64 and arm64 tarballs, debs and rpms, writes checksums.txt,
# signs it keyless with cosign (checksums.txt.sigstore.json), writes an SBOM per
# artifact with syft, pushes and signs the container image, and creates the GitHub
# Release. A provenance attestation over checksums.txt follows.
#
# Every action is pinned by commit SHA; the comment names the tag it resolved from.
on:
  push:
    tags:
      - 'v*-stagehand.*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      packages: write      # push ghcr.io/puppet-stagehand/webhook-go
      id-token: write      # OIDC token for cosign keyless signing and the attestation
      attestations: write  # publish the build provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release must come from the stagehand branch (FK-01), never from a tag
      # placed on upstream's master or on an unreviewed commit.
      - name: Refuse tags that are not on the stagehand branch
        run: |
          set -euo pipefail
          git fetch origin stagehand --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/stagehand; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on the stagehand branch" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - name: Test
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "v2.18.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail loudly rather than attest nothing.
      - name: Check the signed checksums file exists
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          test -s dist/checksums.txt.sigstore.json

      # The same check an operator runs before pinning (USER-GUIDE.md). If the
      # certificate identity in the docs is wrong, the release fails here.
      - name: Verify the signature as an operator would
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt
          (cd dist && sha256sum -c checksums.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
